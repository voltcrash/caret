[package]
name = "oxytype-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Offline Oxytype terminal client using the shared Rust typing engine"

[[bin]]
name = "oxytype"
path = "src/main.rs"

[dependencies]
typing-engine = { path = "../typing-engine" }
serde.workspace = true
serde_json.workspace = true
ratatui = { version = "=0.30.2", default-features = false, features = [
  "crossterm",
  "layout-cache",
] }
crossterm = "=0.29.0"
clap = { version = "4.5", features = ["derive", "env", "string"] }
signal-hook = "=0.4.5"
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"
directories = "=6.0.0"
rusqlite = { version = "=0.41.0", features = ["bundled"] }
sha2 = "0.10.9"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal", "process"] }

[dev-dependencies]
portable-pty = "=0.9.0"
vt100 = "=0.16.2"

[lints]
workspace = true
