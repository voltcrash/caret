<head>
  <link
    rel="preload"
    href="/webfonts/RobotoMono-Regular.woff2"
    type="font/woff2"
    as="font"
    crossorigin
  />
  <link
    rel="preload"
    href="/webfonts/LexendDeca-Regular.woff2"
    type="font/woff2"
    as="font"
    crossorigin
  />

  <script>
    document.addEventListener("keydown", function (e) {
      if (e.key == "Escape") e.preventDefault();
    });
  </script>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
  />
  <title>Oxytype | A minimalistic, customizable typing test</title>
  <!-- fallback theme colors -->
  <style>
    :root {
      --bg-color: #323437;
      --main-color: #e2b714;
      --caret-color: #e2b714;
      --sub-color: #646669;
      --sub-alt-color: #2c2e31;
      --text-color: #d1d0c5;
      --error-color: #ca4754;
      --error-extra-color: #7e2a33;
      --colorful-error-color: #ca4754;
      --colorful-error-extra-color: #7e2a33;
      --nav-focus-opacity: 0;
    }
  </style>
  <script>
    // Paint the last used theme before the app loads (saved by Theme.tsx).
    try {
      var themeColors = JSON.parse(localStorage.getItem("themeColors"));
      var themeCss = "";
      for (var name in themeColors) {
        var value = themeColors[name];
        if (/^[a-z-]+$/.test(name) && /^[\w#(),.%\s-]+$/.test(value)) {
          themeCss += "--" + name + ":" + value + ";";
        }
      }
      if (themeCss !== "") {
        var themeStyle = document.createElement("style");
        themeStyle.id = "themeBootstrap";
        themeStyle.textContent = ":root:root{" + themeCss + "}";
        document.head.appendChild(themeStyle);
      }
    } catch (e) {}
  </script>
  <link rel="icon" type="image/svg+xml" href="/images/favicon/oxytype.svg" />
  <meta
    name="name"
    content="Oxytype | A minimalistic, customizable typing test"
  />
  <meta
    name="description"
    content="The most customizable typing test website with a minimal design and a ton of features. Test yourself in various modes, track your progress and improve your speed."
  />
  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="/images/icons/oxytype-180.png"
  />
  <!-- added to the home screen: open full screen like an app -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Oxytype" />
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  />
  <meta
    name="keywords"
    content="typing test, oxytype, speed test, typing, words per minute"
  />
  <meta name="author" content="Oxytype contributors" />
  <meta
    property="og:title"
    content="Oxytype | A minimalistic, customizable typing test"
  />
  <meta property="og:type" content="website" />
  <meta
    property="og:description"
    content="The most customizable typing test website with a minimal design and a ton of features. Test yourself in various modes, track your progress and improve your speed."
  />
  <meta
    name="twitter:title"
    content="Oxytype | A minimalistic, customizable typing test"
  />
  <meta name="twitter:card" content="summary" />
  <meta name="darkreader-lock" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <link rel="stylesheet" href="styles/tailwind.css" />
</head>
