packages:
  - frontend
  - backend
  - packages/*
  - tui
  - frontend/storybook

allowBuilds:
  "@fortawesome/fontawesome-free": true
  "@parcel/watcher": true
  "@sentry/cli": true
  core-js: true
  cpu-features: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  re2: true
  ssh2: true
  workerd: true

overrides:
  "esbuild": "0.28.1"
  "@babel/core@^7": "7.29.6"
  "yaml@^1": "1.10.3"
  "source-map-js": "1.2.2"
  "browserslist": "4.28.7"
  "brace-expansion@^2": "2.1.7"
  "brace-expansion@^5": "5.0.12"
  "brace-expansion@^1": "1.1.21"
  "seroval": "1.6.3"
  # Authentication uses Drizzle; exclude the unused adapter and optional driver.
  "better-auth>@better-auth/mongo-adapter": "-"
  "better-auth>mongodb": "-"
  "postcss": "8.5.28"
  "cssnano": "8.0.10"
  "re2": "1.27.0"
  "nan": "2.29.0"
  "@ts-rest/core>zod": "4.6.5"
  "@ts-rest/open-api>zod": "4.6.5"
  "@anatine/zod-openapi>zod": "4.6.5"
  "zod-urlsearchparams>zod": "4.6.5"
  vite@*: "catalog:"
  vitest@*: "catalog:"
  "@vitest/browser-preview": "5.0.3"
  "@types/chartjs-plugin-trendline>chart.js": "4.5.1"
  "@vitest/browser": "5.0.3"
  "@vitest/mocker": "5.0.3"
  "@vitest/pretty-format": "5.0.3"
  "@vitest/snapshot": "5.0.3"
  "@vitest/spy": "5.0.3"
  "@vitest/utils": "5.0.3"

engineStrict: true
saveExact: true
savePrefix: ""
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest: 5.0.3
  vite-plus: 1.0.0
  "@vitest/coverage-v8": 5.0.3
  "@vitest/browser-playwright": 5.0.3
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  - "@tanstack/db-ivm@0.1.24"
  - "@tanstack/db@0.11.0"
  - "@tanstack/query-db-collection@1.3.1"
  - "@tanstack/solid-db@0.3.0"
  - dotenv@18.0.5
  - "@redocly/cli@2.57.0"
  - knip@6.39.0
  - stylelint@17.16.0
  - "@vitest/browser-playwright@5.0.3"
  - "@vitest/browser@5.0.3"
  - "@vitest/coverage-v8@5.0.3"
  - "@vitest/mocker@5.0.3"
  - "@vitest/pretty-format@5.0.3"
  - "@vitest/spy@5.0.3"
  - "@vitest/ui@5.0.3"
  - "@vitest/utils@5.0.3"
  - vitest@5.0.3
  - "@vitest/browser-preview@5.0.3"
  - "@better-auth/core@1.7.7"
  - "@better-auth/drizzle-adapter@1.7.7"
  - "@better-auth/kysely-adapter@1.7.7"
  - "@better-auth/memory-adapter@1.7.7"
  - "@better-auth/prisma-adapter@1.7.7"
  - "@better-auth/telemetry@1.7.7"
  - better-auth@1.7.7
  - miniflare@5.20261001.0-alpha
  - wrangler@4.146.0
patchedDependencies:
  "@anatine/zod-openapi@1.14.2": patches/@anatine__zod-openapi@1.14.2.patch
  "@ts-rest/core@3.52.1": patches/@ts-rest__core@3.52.1.patch
  zod-urlsearchparams@0.0.16: patches/zod-urlsearchparams@0.0.16.patch
