name: Set up Vite+
description: Install Vite+, Node.js and workspace dependencies, restoring the dependency cache.

inputs:
  save-cache:
    description: Save the dependency cache when the job ends. Enable in one job per run to avoid racing uploads.
    default: "false"
  rust:
    description: Restore the Rust build cache, for jobs that run cargo themselves.
    default: "false"
  task-cache:
    description: Isolated task-cache namespace; empty disables task caching.
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Vite+ and install dependencies
      uses: voidzero-dev/setup-vp@v1.22.0
      with:
        node-version-file: .node-version
        cache: true
        cache-toolchain: true
        cache-save: ${{ inputs.save-cache }}
    - name: Prepare generated engine bindings
      uses: ./.github/actions/setup-engine
      with:
        rust: ${{ inputs.rust }}
    # Install first: package installation may recreate node_modules.
    # Vite Task validates file, argument and environment fingerprints itself.
    - name: Restore and save Vite Task results
      if: inputs.task-cache != ''
      uses: actions/cache@v6.1.0
      with:
        path: node_modules/.vite/task-cache
        key: vite-task-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.task-cache }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: vite-task-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.task-cache }}-
