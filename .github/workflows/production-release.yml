name: Production deployment

# Deploy successful main-push CI snapshots automatically; allow manual retries.
on:
  workflow_run:
    workflows: [Caret CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: caret-production-release
  cancel-in-progress: false

env:
  CI: "true"

jobs:
  deploy:
    if: >-
      github.repository == 'voltcrash/caret' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.conclusion == 'success'
        )
      )
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # workflow_run's github.sha may already point at a newer main commit.
      DEPLOYMENT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    environment:
      name: production
      url: https://caret.voltcrash.com
    steps:
      - name: Check out the run's main snapshot
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.DEPLOYMENT_SHA }}
          persist-credentials: false

      - name: Require successful CI for the deployment commit
        id: validate-ci
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const { requireSuccessfulProductionCI } = await import(`${process.env.GITHUB_WORKSPACE}/packages/release/src/production-validation.js`);
            const run = await requireSuccessfulProductionCI({ github, context, sha: process.env.DEPLOYMENT_SHA });
            await core.summary.addLink('Validated Caret CI', run.html_url).write();

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          run-install: false

      - name: Prepare production credentials and build settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRODUCTION_BACKEND_ENV: ${{ secrets.PRODUCTION_BACKEND_ENV }}
          BETTER_AUTH_API_KEY: ${{ secrets.BETTER_AUTH_API_KEY }}
          PRODUCTION_FRONTEND_ENV: ${{ vars.PRODUCTION_FRONTEND_ENV }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          for (const key of ['CLOUDFLARE_API_TOKEN', 'PRODUCTION_BACKEND_ENV', 'PRODUCTION_FRONTEND_ENV']) {
            if (!process.env[key]?.trim()) throw new Error(`Configure the production Actions input ${key}`);
          }
          const dashboardApiKey = process.env.BETTER_AUTH_API_KEY?.trim();
          const backendEnv = process.env.PRODUCTION_BACKEND_ENV + (dashboardApiKey ? `\nBETTER_AUTH_API_KEY=${JSON.stringify(dashboardApiKey)}\n` : '');
          writeFileSync('frontend/.dev.vars.production', backendEnv, { mode: 0o600 });
          writeFileSync('frontend/.env.production.local', process.env.PRODUCTION_FRONTEND_ENV, { mode: 0o600 });
          NODE

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Prepare pinned Rust and browser Wasm
        uses: ./.github/actions/setup-engine

      - name: Build production frontend and Worker
        env:
          CARET_BUILD_ID: ${{ env.DEPLOYMENT_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: vp run --filter @caret/frontend build:production-site

      - name: Check production deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: vp run --filter @caret/frontend deploy:production-dry-run

      - name: Retire the removed production task consumer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: vp run --filter @caret/frontend retire:production-task-consumer

      - name: Apply production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: vp run --filter @caret/frontend db:migrate:production

      - name: Deploy production with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: vp run --filter @caret/frontend deploy:production-site

      - name: Remove private settings
        if: always()
        run: rm -f frontend/.dev.vars.production frontend/.env.production.local
