name: Oxytype CI

env:
  NODE_VERSION: "24.21.0"
  BUN_VERSION: "1.4.2"
  TURNSTILE_SITE_KEY: "1x00000000000000000000AA"

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    branches: [main, "stack/**"]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: group-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  pre-ci:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'force-ci') || contains(github.event.pull_request.labels.*.name, 'force-full-ci')
    name: pre-ci
    runs-on: ubuntu-latest
    outputs:
      should-build-be: ${{ steps.export-changes.outputs.should-build-be }}
      should-build-fe: ${{ steps.export-changes.outputs.should-build-fe }}
      should-build-pkg: ${{ steps.export-changes.outputs.should-build-pkg }}
      should-build-tui: ${{ steps.export-changes.outputs.should-build-tui }}
      assets-or-styles: ${{ steps.export-changes.outputs.assets-or-styles }}
      shared-inputs: ${{ steps.filter.outputs.shared-src }}

    steps:
      - name: Full checkout
        uses: actions/checkout@v7.0.1
        # paths filter doesn't need checkout on pr
        if: github.event_name != 'pull_request'

      - name: Detect changes
        uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            shared-src:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'knip.ts'
              - 'stylelint.config.mjs'
              - '.oxfmtrc-editor.json'
              - '.editorconfig'
              - '.nvmrc'
              - '.npmrc'
              - 'patches/**'
              - '.github/actions/**'
              - '.github/workflows/oxytype-ci.yml'
            assets-or-styles:
              - 'frontend/static/**/*'
              - '**/*.{scss,css}'
            be-src:
              - 'backend/**/*'
              - 'backend/package.json'
              - '.github/workflows/production-release.yml'
            fe-src:
              - 'frontend/**/*.{ts,tsx,js,scss,html}'
              - 'frontend/**/package.json'
              - 'frontend/wrangler.jsonc'
            pkg-src:
              - 'packages/**/*'
              - '.github/workflows/production-release.yml'
            tui-src:
              - 'tui/**/*'
              - 'packages/**/*'
              - 'frontend/static/languages/english.json'
              - 'frontend/static/quotes/english.json'
              - 'frontend/static/layouts/qwerty.json'
              - '.github/workflows/tui-release.yml'

      - name: Export changes
        id: export-changes
        run: |
          echo "should-build-pkg=${{ steps.filter.outputs.pkg-src == 'true' || steps.filter.outputs.shared-src == 'true' }}" >> $GITHUB_OUTPUT
          echo "should-build-tui=${{ steps.filter.outputs.tui-src == 'true' || steps.filter.outputs.shared-src == 'true' }}" >> $GITHUB_OUTPUT
          echo "should-build-be=${{ steps.filter.outputs.be-src == 'true' || steps.filter.outputs.shared-src == 'true' }}" >> $GITHUB_OUTPUT
          echo "should-build-fe=${{ steps.filter.outputs.fe-src == 'true' || steps.filter.outputs.be-src == 'true' || steps.filter.outputs.shared-src == 'true' }}" >> $GITHUB_OUTPUT
          echo "assets-or-styles=${{ steps.filter.outputs.assets-or-styles == 'true' || steps.filter.outputs.shared-src == 'true' }}" >> $GITHUB_OUTPUT

  prime-cache:
    name: prime-cache
    runs-on: ubuntu-latest
    needs: [pre-ci]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'force-ci') || contains(github.event.pull_request.labels.*.name, 'force-full-ci')
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Vite+ and install dependencies
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Saves the pnpm store once so parallel jobs only restore it.
          cache: true

  check-format:
    name: check-format
    needs: [prime-cache]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'force-ci') || contains(github.event.pull_request.labels.*.name, 'force-full-ci')
    runs-on: ubuntu-latest
    steps:
      - name: Full checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Get changed files and write to temp
        id: get-changed-files
        uses: actions/github-script@v9.0.0
        with:
          script: |
            let files;
            if (context.eventName === "pull_request") {
              const changedFiles = await github.paginate(
                github.rest.pulls.listFiles,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                }
              );
              files = changedFiles.filter(file => file.status !== "removed").map(file => file.filename);
            } else {
              const before = context.payload.before;
              const args = /^0+$/.test(before)
                ? ["ls-files", "-z"]
                : ["diff", "--name-only", "--diff-filter=ACMRTUXB", "-z", before, context.sha];
              files = require("child_process").execFileSync("git", args, { encoding: "utf8" }).split("\0").filter(Boolean);
            }
            if (files.length > 0) {
              require('fs').writeFileSync('/tmp/changed-files.txt', files.join('\0'));
              core.setOutput('has-files', 'true');
            }

      - name: Set up Vite+ and install dependencies
        if: steps.get-changed-files.outputs.has-files == 'true'
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true
          cache-save: false

      - name: Check formatting (changed files)
        if: steps.get-changed-files.outputs.has-files == 'true'
        run: |
          xargs -0 vp fmt --check --no-error-on-unmatched-pattern < /tmp/changed-files.txt

  knip:
    name: knip
    needs: [prime-cache]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'force-ci') || contains(github.event.pull_request.labels.*.name, 'force-full-ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Vite+ and install dependencies
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true
          cache-save: false

      - name: Find unused code and dependencies
        run: vp run knip

  ci-be:
    name: ci-be
    needs: [pre-ci, prime-cache]
    runs-on: ubuntu-latest
    if: needs.pre-ci.outputs.should-build-be == 'true' || needs.pre-ci.outputs.should-build-pkg == 'true' || contains(github.event.pull_request.labels.*.name, 'force-full-ci')
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Vite+ and install dependencies
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Restores the pnpm store saved by prime-cache.
          cache: true
          cache-save: false

      - name: Check lint
        run: vp run lint-fast-be && vp run lint-be

      - name: Build
        run: vp run build-be

      - name: Test
        run: vp run test-be

  ci-fe:
    name: ci-fe
    needs: [pre-ci, prime-cache]
    runs-on: ubuntu-latest
    if: needs.pre-ci.outputs.should-build-fe == 'true' || needs.pre-ci.outputs.should-build-pkg == 'true' || contains(github.event.pull_request.labels.*.name, 'force-full-ci')
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Vite+ and install dependencies
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Restores the pnpm store saved by prime-cache.
          cache: true
          cache-save: false

      - name: Check lint
        run: vp run lint-fast-fe && vp run lint-fe

      - name: Build
        run: vp run build-fe

      - name: Test
        run: vp run test-fe

  test-e2e:
    name: test-e2e
    needs: [pre-ci, prime-cache]
    runs-on: ubuntu-latest
    if: needs.pre-ci.outputs.should-build-fe == 'true' || needs.pre-ci.outputs.should-build-pkg == 'true' || contains(github.event.pull_request.labels.*.name, 'force-full-ci')
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Vite+ and install dependencies
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true
          cache-save: false

      - name: Install Chromium and its system dependencies
        run: vp -C frontend exec playwright install --with-deps chromium

      - name: Run browser regression suite
        run: vp run --filter @oxytype/frontend test-e2e:legacy

  # Start owns delivery. Rollback UI/backend builds remain until Stage 8.
  ci-start:
    name: ci-start
    needs: [pre-ci, prime-cache]
    runs-on: ubuntu-latest
    if: needs.pre-ci.outputs.should-build-fe == 'true' || needs.pre-ci.outputs.should-build-be == 'true' || needs.pre-ci.outputs.should-build-pkg == 'true' || contains(github.event.pull_request.labels.*.name, 'force-full-ci')
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Vite+ and install dependencies
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true
          cache-save: false

      - name: Check operation ownership and declared HTTP routes
        run: vp -C backend exec tsx scripts/migration-inventory.ts --check && vp -C frontend exec tsx scripts/generate-http-routes.ts --check

      - name: Build Start Worker and runtime-test entry
        run: vp run --filter @oxytype/frontend build:start && vp run --filter @oxytype/frontend build:start:test

      - name: Worker dry-run
        run: vp run --filter @oxytype/frontend dry-run:start

      - name: SSR, workerd and bundle-boundary suites
        run: vp run --filter @oxytype/frontend test:start

      - name: Install Chromium and its system dependencies
        run: vp -C frontend exec playwright install --with-deps chromium

      - name: Production-Worker browser checks
        run: vp run --filter @oxytype/frontend test:start:browser

      - name: Upload browser traces
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: start-browser-traces
          path: frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Multi-build service worker, real save and rollback checks
        run: vp run --filter @oxytype/frontend test:updates

      # Last: overwrites dist/start with the staging delivery configuration.
      - name: Staging build and dry-run
        run: vp run --filter @oxytype/frontend build:start:staging && vp run --filter @oxytype/frontend dry-run:start

      - name: Production configuration build and dry-run (fixture public settings)
        env:
          OXYTYPE_DEPLOY_ENV: production
          OXYTYPE_BUILD_ID: ci-${{ github.sha }}
        run: vp run --filter @oxytype/frontend build:start && vp run --filter @oxytype/frontend dry-run:start

  ci-assets:
    name: ci-assets
    needs: [pre-ci, prime-cache]
    runs-on: ubuntu-latest
    if: needs.pre-ci.outputs.assets-or-styles == 'true' || needs.pre-ci.outputs.should-build-pkg == 'true' || contains(github.event.pull_request.labels.*.name, 'force-full-ci')
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            styles:
              - '**/*.{scss,css}'
            json:
              - 'frontend/static/**/*.json'
            languages:
              - 'frontend/static/languages/**'
            quotes:
              - 'frontend/static/quotes/**'
            others:
              - 'frontend/static/layouts/**'
              - 'frontend/static/themes/**'
              - 'frontend/static/webfonts/**'
              - 'frontend/static/challenges/**'
              - 'frontend/static/sounds/**'

      - name: Set up Vite+ and install dependencies
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Restores the pnpm store saved by prime-cache.
          cache: true
          cache-save: false

      - name: Lint styles
        if: steps.filter.outputs.styles == 'true' || needs.pre-ci.outputs.shared-inputs == 'true'
        run: vp run lint-styles

      - name: Lint JSON
        if: steps.filter.outputs.json == 'true' || needs.pre-ci.outputs.shared-inputs == 'true'
        run: vp run check-assets-json

      - name: Validate language assets
        if: steps.filter.outputs.languages == 'true' || needs.pre-ci.outputs.should-build-pkg == 'true'
        run: vp run check-assets-languages

      - name: Validate quote assets
        if: steps.filter.outputs.quotes == 'true' || needs.pre-ci.outputs.shared-inputs == 'true'
        run: vp run check-assets-quotes

      - name: Validate other assets
        if: steps.filter.outputs.others == 'true' || needs.pre-ci.outputs.should-build-pkg == 'true'
        run: vp run check-assets-others

  ci-pkg:
    name: ci-pkg
    needs: [pre-ci, prime-cache]
    runs-on: ubuntu-latest
    if: needs.pre-ci.outputs.should-build-pkg == 'true' || contains(github.event.pull_request.labels.*.name, 'force-full-ci')
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Vite+ and install dependencies
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Restores the pnpm store saved by prime-cache.
          cache: true
          cache-save: false

      - name: Check shared lint configuration
        run: vp run lint-check-config

      - name: Check lint suppression reasons
        run: vp run lint-suppressions

      - name: Check lint
        run: vp run lint-fast-pkg && vp run lint-pkg

      - name: Check workspace root lint
        run: vp lint . --type-aware --type-check --format agent

      - name: Test
        run: vp run test-pkg

  ci-tui:
    name: ci-tui
    needs: [pre-ci, prime-cache]
    runs-on: ubuntu-latest
    if: needs.pre-ci.outputs.should-build-tui == 'true' || contains(github.event.pull_request.labels.*.name, 'force-full-ci')
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Vite+ and install dependencies
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Restores the pnpm store saved by prime-cache.
          cache: true
          cache-save: false
          # Bun is the tui runtime, pinned by setup-bun; don't let vp shim it.
          package-manager: |
            bun: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Check lint
        run: vp run lint-fast-tui && vp run lint-tui

      - name: Test
        run: vp run test-tui

      - name: Build and smoke npm package
        run: vp run --filter @voltcrash/oxytype package-check
