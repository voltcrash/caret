name: Browser compatibility and performance
on:
  schedule:
    - cron: "31 3 * * *"
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  performance:
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.CARET_PERFORMANCE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-chromium
      - run: vp -C frontend exec vpx ./scripts/ci-build.ts
        env:
          CARET_ENGINE_PROOF: "true"
      - run: vp exec mkdir -p frontend/.reports
      - run: vp -C frontend exec playwright test --config playwright.migration.config.ts engine-performance.migration.ts performance.migration.ts
        env:
          ENGINE_PERFORMANCE_OUTPUT: .reports/interaction.json
          ENGINE_WEBSITE_SOAK_OUTPUT: .reports/soak.json
          CARET_PERFORMANCE_OUTPUT: .reports/startup.json
          ENGINE_ENFORCE_PERFORMANCE: ${{ vars.CARET_ENFORCE_PERFORMANCE || 'false' }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: typing-performance
          path: |
            frontend/.reports
            frontend/test-results
          retention-days: 30
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      # Keep the Worker fixture on the runner. Browsers share its loopback network.
      - name: Start browsers with their bundled system libraries
        working-directory: frontend
        run: |
          core=$(node -p 'require("node:path").dirname(require.resolve("playwright-core/package.json", { paths: [require.resolve("playwright/package.json")] }))')
          version=$(node -p 'require("playwright/package.json").version')
          docker run --detach --interactive --init --network host --shm-size=1g \
            --name playwright --volume "$core:/driver:ro" \
            "mcr.microsoft.com/playwright:v${version}-noble" \
            node /driver/cli.js run-server --host 127.0.0.1 --port 3000
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:3000/ || { docker logs playwright; exit 1; }
      - if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v8.0.2
        with:
          name: start-worker
          path: frontend/dist/start
      - if: github.event_name != 'pull_request'
        run: vp -C frontend exec vpx ./scripts/ci-build.ts
      - run: vp -C frontend exec playwright test --config playwright.cross-browser.config.ts
        env:
          PW_TEST_CONNECT_WS_ENDPOINT: ws://127.0.0.1:3000/
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: cross-browser-evidence
          path: frontend/test-results
          retention-days: 7
