name: Set up Vite+
description: Install Vite+, Node.js and workspace dependencies, restoring the dependency cache.

inputs:
  save-cache:
    description: Save the dependency cache when the job ends. Enable in one job per run to avoid racing uploads.
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Vite+ and install dependencies
      uses: voidzero-dev/setup-vp@v1.22.0
      with:
        node-version-file: .node-version
        cache: true
        cache-save: ${{ inputs.save-cache }}
    - name: Prepare generated engine bindings
      uses: ./.github/actions/setup-engine
