name: Browser compatibility and performance
on:
  schedule:
    - cron: "31 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/cross-browser-e2e/**"
      - "frontend/playwright.cross-browser.config.ts"
      - ".github/workflows/browser-compatibility.yml"
permissions:
  contents: read
jobs:
  performance:
    runs-on: ${{ vars.CARET_PERFORMANCE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-chromium
      - run: vp -C frontend exec vpx ./scripts/ci-build.ts
        env:
          CARET_ENGINE_PROOF: "true"
      - run: vp exec mkdir -p frontend/.reports
      - run: vp -C frontend exec playwright test --config playwright.migration.config.ts engine-performance.migration.ts performance.migration.ts
        env:
          ENGINE_PERFORMANCE_OUTPUT: .reports/interaction.json
          ENGINE_WEBSITE_SOAK_OUTPUT: .reports/soak.json
          CARET_PERFORMANCE_OUTPUT: .reports/startup.json
          ENGINE_ENFORCE_PERFORMANCE: ${{ vars.CARET_ENFORCE_PERFORMANCE || 'false' }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: typing-performance
          path: |
            frontend/.reports
            frontend/test-results
          retention-days: 30
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: vp -C frontend exec playwright install --with-deps chromium firefox webkit
      - run: vp -C frontend exec vpx ./scripts/ci-build.ts
      - run: vp -C frontend exec playwright test --config playwright.cross-browser.config.ts
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: cross-browser-evidence
          path: frontend/test-results
          retention-days: 7
