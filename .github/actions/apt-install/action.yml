name: Install apt packages
description: Install Ubuntu packages from cached downloads, retrying stalled mirrors instead of hanging the job.

inputs:
  name:
    description: Cache name for this package set.
    required: true
  packages:
    description: Space-separated packages to install.
    default: ""
  command:
    description: Command that installs packages through apt-get itself, instead of `packages`.
    default: ""

runs:
  using: composite
  steps:
    - name: Name the package cache
      id: key
      shell: bash
      env:
        NAME: ${{ inputs.name }}
      # Each runner image refresh saves new downloads; older ones still seed the restore.
      run: |
        echo "prefix=apt-$ImageOS-$RUNNER_ARCH-$NAME-" >> "$GITHUB_OUTPUT"
        echo "key=apt-$ImageOS-$RUNNER_ARCH-$NAME-$ImageVersion" >> "$GITHUB_OUTPUT"

    - name: Restore downloaded packages
      id: restore
      uses: actions/cache/restore@v6.1.0
      with:
        path: ~/.cache/apt-archives
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}

    - name: Install packages
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        COMMAND: ${{ inputs.command }}
      run: |
        mkdir -p ~/.cache/apt-archives/partial
        sudo tee /etc/apt/apt.conf.d/99caret-ci >/dev/null <<EOF
        Dir::Cache::Archives "$HOME/.cache/apt-archives/";
        APT::Keep-Downloaded-Packages "true";
        Binary::apt::APT::Keep-Downloaded-Packages "true";
        Acquire::Retries "3";
        Acquire::http::Timeout "20";
        Acquire::https::Timeout "20";
        DPkg::Lock::Timeout "120";
        EOF
        install=${COMMAND:-"sudo apt-get update && sudo apt-get install --no-install-recommends -y $PACKAGES"}
        # A mirror can trickle at a few kB/s for many minutes without timing out,
        # so bound each attempt and move the slow mirror to the back before retrying.
        # Finished downloads stay in the archive directory, so a retry resumes.
        for attempt in 1 2 3; do
          timeout --kill-after=15 240 bash -c "$install" && exit 0
          echo "::warning::apt install attempt $attempt failed or stalled"
          # timeout cannot signal apt-get through sudo, so stop it as root.
          sudo pkill -x apt-get || true
          sudo dpkg --configure -a || true
          [[ $(wc -l </etc/apt/apt-mirrors.txt 2>/dev/null) -gt 1 ]] && sudo sed -i '1{h;d};${G}' /etc/apt/apt-mirrors.txt
        done
        exit 1

    - name: Save downloaded packages
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      # apt leaves root-only lock and partial files the cache upload cannot read.
      run: |
        sudo rm -rf ~/.cache/apt-archives/lock ~/.cache/apt-archives/partial
        sudo chown -R "$(id -u):$(id -g)" ~/.cache/apt-archives

    - if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6.1.0
      continue-on-error: true
      with:
        path: ~/.cache/apt-archives
        key: ${{ steps.key.outputs.key }}
