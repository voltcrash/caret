[workspace]
members = [
  "crates/typing-engine",
  "crates/typing-engine-wasm",
  "crates/typing-audit-wasm",
  "crates/caret-tui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
repository = "https://github.com/voltcrash/caret"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = [
  "preserve_order",
  "float_roundtrip",
] }
wasm-bindgen = "=0.2.129"
ts-rs = { version = "=12.0.1", features = ["serde-json-impl"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = "debuginfo"

[profile.wasm]
inherits = "release"
opt-level = "z"
