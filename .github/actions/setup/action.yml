name: Set up Vite+
description: Install Vite+, Node.js and workspace dependencies, restoring caches.

inputs:
  save-cache:
    description: Save the dependency and toolchain caches when the job ends. Enable in one job per run to avoid racing uploads.
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Vite+ and install dependencies
      uses: voidzero-dev/setup-vp@v1.21.2
      with:
        node-version-file: .node-version
        cache: true
        # Caches the Vite+ CLI, Node.js and pnpm themselves (exact versions only).
        cache-toolchain: true
        cache-save: ${{ inputs.save-cache }}
